name: Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.3)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "full=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package plugin.zip
        shell: bash
        run: |
          zip -r plugin.zip backend plugin.json public readme.md
          ls -la plugin.zip

      - name: Compute digests
        id: digests
        shell: bash
        run: |
          echo "zip_sha=$(sha256sum plugin.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dll_sha=$(sha256sum winmm.dll | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.full }}
          name: "GabLuchi Plugin v${{ steps.version.outputs.tag }}"
          body: |
            ## GabLuchi Plugin v${{ steps.version.outputs.tag }}

            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            Install through the GabLuchi app (it auto-detects plugin releases), or unpack `plugin.zip` manually into Millennium's `plugins` folder.
          files: |
            plugin.zip
            winmm.dll

      - name: Commit release-info.json
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.full }}
          TAGVER: ${{ steps.version.outputs.tag }}
          ZIP_SHA: ${{ steps.digests.outputs.zip_sha }}
          DLL_SHA: ${{ steps.digests.outputs.dll_sha }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download"
          cat > release-info.json <<EOF
          {
            "tag_name": "${TAG}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": [
              { "name": "plugin.zip", "browser_download_url": "${BASE}/${TAG}/plugin.zip", "digest": "${ZIP_SHA}" },
              { "name": "winmm.dll", "browser_download_url": "${BASE}/${TAG}/winmm.dll", "digest": "${DLL_SHA}" }
            ]
          }
          EOF
          git config user.name "gabluchi-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add release-info.json
          git commit -m "chore: release-info.json for ${TAG}" || echo "no changes"
          git push origin HEAD:main
