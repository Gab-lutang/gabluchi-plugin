name: Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.3)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "full=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package plugin.zip
        shell: bash
        run: |
          zip -r plugin.zip backend plugin.json public readme.md
          ls -la plugin.zip

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.full }}
          name: "GabLuchi Plugin v${{ steps.version.outputs.tag }}"
          body: |
            ## GabLuchi Plugin v${{ steps.version.outputs.tag }}

            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            Install through the GabLuchi app (it auto-detects plugin releases), or unpack `plugin.zip` manually into Millennium's `plugins` folder.
          files: |
            plugin.zip
            winmm.dll
